[project]
name = "bouyomichan"
version = "0.1.2"
description = "Text to speech interface for BouyomiChan"
readme = "README.md"
authors = [
    { name = "yumimint", email = "i.yumimint@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
test_bouyomi = "bouyomichan.test_bouyomi:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/yumimint/bouyomichan"
Issues = "https://github.com/yumimint/bouyomichan/issues"
